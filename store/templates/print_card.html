<!doctype html>
<html lang="{{ language }}">
<head>
<meta charset="utf-8">
<style>
{% if font_uris.cormorant_regular %}
@font-face{font-family:'Cormorant Garamond Local';src:url('{{ font_uris.cormorant_regular }}');font-style:normal;font-weight:400}
{% endif %}
{% if font_uris.cormorant_semibold %}
@font-face{font-family:'Cormorant Garamond Local';src:url('{{ font_uris.cormorant_semibold }}');font-style:normal;font-weight:600}
{% endif %}
{% if font_uris.allura_regular %}
@font-face{font-family:'Allura Local';src:url('{{ font_uris.allura_regular }}');font-style:normal;font-weight:400}
{% endif %}
@page{size:{{ dimensions.page_w_mm }}mm {{ dimensions.page_h_mm }}mm;margin:0}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:{{ dimensions.page_w_mm }}mm;background:#fff}
body{font-family:'Cormorant Garamond Local','Cormorant Garamond',Georgia,serif;color:#263f4a}
.print-page{position:relative;width:{{ dimensions.page_w_mm }}mm;height:{{ dimensions.page_h_mm }}mm;page-break-after:always;overflow:hidden;background:#fffaf0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.print-page:last-child{page-break-after:auto}
{% if background_uri %}
.print-page{background-image:url('{{ background_uri }}');background-size:cover;background-position:center;background-repeat:no-repeat}
{% endif %}
.trim{position:absolute;left:{{ dimensions.bleed_mm }}mm;top:{{ dimensions.bleed_mm }}mm;width:{{ dimensions.trim_w_mm }}mm;height:{{ dimensions.trim_h_mm }}mm}
.frame{position:absolute;left:3.5mm;right:3.5mm;top:3.5mm;bottom:11mm;border:.25mm solid #b88d34;pointer-events:none}
.content{position:absolute;left:8mm;right:8mm;top:8mm;bottom:14mm;padding:0 1mm;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2mm}
.rings{position:relative;width:22mm;height:12mm;margin:0 0 1.5mm}
.ring{position:absolute;top:1.1mm;width:10mm;height:8mm;border:.75mm solid #b88d34;border-radius:50%;box-shadow:inset 0 0 0 .28mm #e4c879}
.ring.one{left:2.1mm;transform:rotate(-14deg)}
.ring.two{right:2.1mm;transform:rotate(14deg)}
.title{font-family:'Cormorant Garamond Local','Cormorant Garamond',Georgia,serif;font-size:7mm;font-weight:600;line-height:1.02;max-width:92%}
.names{font-family:'Allura Local','Allura',cursive;font-size:9mm;font-weight:400;color:#b88d34;line-height:1.02;max-width:92%}
.field{font-family:'Cormorant Garamond Local','Cormorant Garamond',Georgia,serif;font-size:4.1mm;line-height:1.2;max-width:90%;white-space:pre-wrap;text-align:center}
.brand{position:absolute;bottom:5mm;left:50%;transform:translateX(-50%);white-space:nowrap;text-align:center;font-family:'Cormorant Garamond Local','Cormorant Garamond',Georgia,serif;font-size:8pt;line-height:1;color:#4A5D4E;letter-spacing:.05em}
.view-label{display:none}
</style>
</head>
<body>
{% for view in views %}
<section class="print-page" data-view="{{ view }}">
  <div class="trim">
    <div class="frame"></div>
    <main class="content">
      <div class="rings" aria-hidden="true"><span class="ring one"></span><span class="ring two"></span></div>
      {% for key in card.fields %}
        {% set value = values.get(key, '') %}
        {% if value %}
          {% if key == 'title' %}
            <div class="title">{{ value }}</div>
          {% elif key in ['names', 'return_names'] %}
            <div class="names">{{ value }}</div>
          {% else %}
            <div class="field" data-key="{{ key }}">{{ value }}</div>
          {% endif %}
        {% endif %}
      {% endfor %}
    </main>
    <div class="brand">loveforlove.com</div>
  </div>
</section>
{% endfor %}
</body>
</html>
