{% extends "base.html" %}
{% block title %}Test Collection — LOVE FOR LOVE{% endblock %}
{% block content %}
<section class="single-product shop-only">
  <div class="section-label">CURRENT TEST PRODUCT</div>
  {% for product in products %}
  <a class="product-card" href="{{ url_for('product_detail', slug=product.slug) }}">
    <img src="{{ url_for('static', filename='products/' + product.cover) }}" alt="{{ product.name }}">
    <div><span>{{ product.category }}</span><h1>{{ product.name }}</h1><p>{{ product.description }}</p><b>{{ product.status }}</b></div>
  </a>
  {% endfor %}
</section>
{% endblock %}
