name: Prepress Smoke

on:
  push:
    branches:
      - loveforlove-catalog-expansion
    paths:
      - 'store/prepress/**'
      - 'store/print_*.py'
      - '.github/workflows/prepress-smoke.yml'
  pull_request:
    paths:
      - 'store/prepress/**'
      - 'store/print_*.py'
      - '.github/workflows/prepress-smoke.yml'

jobs:
  scribus-template-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build reproducible prepress image
        run: docker build -f store/prepress/Dockerfile -t loveforlove-prepress .

      - name: Verify prepress environment and ICC profiles
        run: docker run --rm loveforlove-prepress python3 prepress/check_environment.py --require-profiles

      - name: Generate and preflight all 30 Scribus base templates
        run: |
          rm -rf .prepress-smoke
          mkdir -p .prepress-smoke
          docker run --rm \
            -e LF_SMOKE_ROOT=/out \
            -v "$PWD/.prepress-smoke:/out" \
            loveforlove-prepress \
            bash prepress/smoke_test.sh

      - name: Count generated templates
        run: test "$(find .prepress-smoke/wedding-day-set/prepress -type f -name '*.sla' | wc -l)" -eq 30

      - name: Upload validated Scribus templates
        uses: actions/upload-artifact@v4
        with:
          name: wedding-day-set-scribus-smoke
          path: .prepress-smoke/wedding-day-set/prepress
          if-no-files-found: error
          retention-days: 7
