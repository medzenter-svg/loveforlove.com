name: Prepress Invitation Prototypes

on:
  pull_request:
    paths:
      - 'store/prepress/**'
      - 'store/print_*.py'
      - '.github/workflows/prepress-invitation-prototypes.yml'

jobs:
  invitation-prototypes:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build reproducible prepress image
        run: docker build -f store/prepress/Dockerfile -t loveforlove-prepress .

      - name: Export seven premium Invitation prototype systems
        run: |
          rm -rf .prepress-invitation-prototypes
          mkdir -p .prepress-invitation-prototypes
          docker run --rm \
            -e LF_PROTOTYPE_SMOKE_ROOT=/out \
            -v "$PWD/.prepress-invitation-prototypes:/out" \
            loveforlove-prepress \
            bash prepress/invitation_prototypes_smoke.sh

      - name: Verify seven themes and 28 professional PDFs
        run: |
          test "$(find .prepress-invitation-prototypes -type f -name '*.pdf' | wc -l)" -eq 28
          for theme in \
            amalfi-luce \
            monaco-regatta \
            como-sereno \
            provence-rose \
            santorini-aegean \
            riviera-garden \
            vienna-champagne
          do
            PACKAGE=".prepress-invitation-prototypes/$theme/export"
            test "$(find "$PACKAGE" -maxdepth 1 -type f -name '*.pdf' | wc -l)" -eq 4
            test -f "$PACKAGE/${theme}__MANIFEST.json"
          done

      - name: Upload premium Invitation prototypes
        uses: actions/upload-artifact@v4
        with:
          name: wedding-invitation-premium-prototypes
          path: .prepress-invitation-prototypes
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 5
