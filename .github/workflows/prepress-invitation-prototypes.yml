name: Prepress Invitation Prototypes

on:
  pull_request:
    paths:
      - 'store/prepress/**'
      - 'store/print_*.py'
      - '.github/workflows/prepress-invitation-prototypes.yml'

jobs:
  invitation-prototypes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build reproducible prepress image
        run: docker build -f store/prepress/Dockerfile -t loveforlove-prepress .

      - name: Export approved Invitation prototype only
        run: |
          rm -rf .prepress-invitation-prototypes
          mkdir -p .prepress-invitation-prototypes
          docker run --rm \
            -e LF_AMALFI_SMOKE_ROOT=/out \
            -v "$PWD/.prepress-invitation-prototypes:/out" \
            loveforlove-prepress \
            bash prepress/amalfi_prototype_smoke.sh

      - name: Verify gated Amalfi prototype
        run: |
          PACKAGE=.prepress-invitation-prototypes/wedding-day-set/amalfi-invitation-prototype
          test "$(find "$PACKAGE" -maxdepth 1 -type f -name '*.pdf' | wc -l)" -eq 4
          test -f "$PACKAGE/INVITATION_EXPORT_SMOKE_MANIFEST.json"

      - name: Upload approved Invitation prototype
        uses: actions/upload-artifact@v4
        with:
          name: wedding-invitation-premium-prototypes
          path: .prepress-invitation-prototypes/wedding-day-set/amalfi-invitation-prototype
          if-no-files-found: error
          retention-days: 5
