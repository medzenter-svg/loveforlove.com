name: Store checks

on:
  push:
    branches: [loveforlove-premium-rebuild]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: store/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
